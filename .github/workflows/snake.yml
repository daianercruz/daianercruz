
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: daianercruz
          outputs: |
            dist/github-snake.svg?color_snake=%239333EA&color_dots=%23110F1A,%233B1C59,%236B21A8,%239333EA,%23C084FC
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23C084FC

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
